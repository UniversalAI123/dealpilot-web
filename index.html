    <script>
      // Apply the stored theme before first paint (no flash). Mirrors src/ui/app/theme.ts.
      (function () {
        try {
          var t = localStorage.getItem('dealpilot:theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
        // The stylesheet uses cascade layers (2022+ browsers). Where they are missing it
        // would be ignored, so say so instead of showing an unstyled app.
        if (!('CSSLayerBlockRule' in window)) {
          document.documentElement.setAttribute('data-legacy-browser', '');
          document.addEventListener('DOMContentLoaded', function () {
            var note = document.getElementById('legacy-browser');
            if (note) note.hidden = false;
          });
        }
      })();
    </script>
    <style>
      /* Pre-CSS paint: avoid a white flash in dark mode before the stylesheet loads.
         The lowest cascade layer (src/ui/styles/cssLayers.ts), so the real stylesheet always wins. */
      @layer prepaint {
        html {
          background: #f1efea;
          color-scheme: light;
        }
        @media (prefers-color-scheme: dark) {
          html:not([data-theme='light']) {
            background: #05070a;
            color-scheme: dark;
          }
        }
        html[data-theme='dark'] {
          background: #05070a;
          color-scheme: dark;
        }
      }
      /* Outside the layers on purpose: browsers without cascade layers still read it. */
      html[data-legacy-browser] #root {
        display: none;
      }
    </style>
